name: Xamvn Forum Automation Bot

on:
  schedule:
    - cron: '42 * * * *'

  workflow_dispatch:
    inputs:
      thread_id:
        description: 'Thread ID hoặc URL chủ đề cần bình luận (để trống sẽ lấy theo config.json)'
        required: false
        default: ''
      message:
        description: 'Nội dung bình luận cần đăng (để trống sẽ tự lấy link từ data_file theo config.json)'
        required: false
        default: ''

  push:
    branches:
      - main
    paths-ignore:
      - 'config.json'
      - 'posted_links.json'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Automation Bot (Live)
        env:
          XAMVN_USERNAME: ${{ secrets.XAMVN_USERNAME }}
          XAMVN_PASSWORD: ${{ secrets.XAMVN_PASSWORD }}
          XAMVN_THREAD_ID: ${{ inputs.thread_id }}
          XAMVN_MESSAGE: ${{ inputs.message }}
        run: |
          # Fallback credentials phòng trường hợp Repo Secrets chưa được thiết lập hoặc bị mất
          export XAMVN_USERNAME="${XAMVN_USERNAME:-xamps69}"
          export XAMVN_PASSWORD="${XAMVN_PASSWORD:-tele1234}"

          echo "🚀 Khởi chạy Xamvn Bot..."
          echo "👤 Tài khoản: ${XAMVN_USERNAME:0:3}*** (độ dài pass: ${#XAMVN_PASSWORD})"

          # Chạy 1 lần đăng cho mỗi khung giờ tự động
          python xamvn_bot.py --count 1 --no-cache -v

      - name: 💾 Save progress (config.json & posted_links.json)
        if: always()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add config.json posted_links.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi tiến độ."
          else
            git commit -m "chore(bot): update start_index & posted_links history [skip ci]"
            git push
          fi
