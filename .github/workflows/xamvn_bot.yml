name: Xamvn Forum Automation Bot

on:
  schedule:
    # 18:15, 19:15, 20:15, 21:15, 22:15, 23:15, 00:15 giờ Việt Nam (UTC+7)
    # Tương ứng 11:15 đến 17:15 UTC mỗi ngày (khoảng 7 lần/ngày)
    - cron: '15 11-17 * * *'

  workflow_dispatch:
    inputs:
      thread_id:
        description: 'Thread ID hoặc URL chủ đề cần bình luận (để trống sẽ lấy theo config.json)'
        required: false
        default: ''
      message:
        description: 'Nội dung bình luận cần đăng (để trống sẽ tự lấy link từ data_file theo config.json)'
        required: false
        default: ''
      offline_only:
        description: 'Chỉ chạy kiểm thử offline từ các file HTML'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Offline HTML Parsing Test
        run: |
          python xamvn_bot.py --offline

      - name: 🚀 Run Automation Bot (Live)
        if: ${{ !inputs.offline_only }}
        env:
          XAMVN_USERNAME: ${{ secrets.XAMVN_USERNAME }}
          XAMVN_PASSWORD: ${{ secrets.XAMVN_PASSWORD }}
          XAMVN_THREAD_ID: ${{ inputs.thread_id }}
          XAMVN_MESSAGE: ${{ inputs.message }}
        run: |
          if [ -z "$XAMVN_USERNAME" ] || [ -z "$XAMVN_PASSWORD" ]; then
            echo "⚠️ CẢNH BÁO: Chưa cấu hình Secrets XAMVN_USERNAME và XAMVN_PASSWORD trên GitHub Repo."
            echo "Vui lòng vào Settings -> Secrets and variables -> Actions để thêm secrets."
            echo "Kiểm thử offline đã hoàn thành thành công."
            exit 0
          fi
          # Chạy 1 lần đăng cho mỗi khung giờ tự động
          python xamvn_bot.py --count 1 --no-cache -v

      - name: 💾 Save progress (config.json & posted_links.json)
        if: ${{ !inputs.offline_only }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add config.json posted_links.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi tiến độ."
          else
            git commit -m "chore(bot): update start_index & posted_links history [skip ci]"
            git push
          fi
